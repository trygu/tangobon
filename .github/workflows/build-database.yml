name: Build word and sentence SQLite database

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  # Allow manual triggering
  workflow_dispatch:

jobs:
  build-database:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest

      - name: Build SQLite database
        run: |
          mkdir -p out
          uv run tangobon build \
            --input-jmdict data/JMdict_e_examp.gz \
            --input-examples data/examples.utf.gz \
            --db out/tangobon.sqlite

      - name: Print stats
        run: uv run tangobon stats --db out/tangobon.sqlite

      - name: Upload database to release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: out/tangobon.sqlite
          asset_name: tangobon.sqlite
          asset_content_type: application/x-sqlite3
